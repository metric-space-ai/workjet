name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (always creates an unpublished draft)
        type: choice
        options: [stable, nightly]
        default: stable
      version:
        description: Stable version, for example 0.0.89 (unused for nightly)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ref: ${{ github.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
      notarized: ${{ steps.signing.outputs.notarized }}
      windows_signing: ${{ steps.signing.outputs.windows_signing }}
      channel: ${{ inputs.channel || 'stable' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Resolve release metadata
        id: meta
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == nightly ]]; then
            node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" --run-number "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" --github-output
          else
            version="${INPUT_VERSION#v}"
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then version="${GITHUB_REF_NAME#v}"; fi
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "A valid release version is required"; exit 1; }
            printf 'version=%s\ntag=v%s\nname=Workjet %s\n' "$version" "$version" "$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect optional Apple signing configuration
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          RP_DOMAINS: ${{ vars.WORKJET_CLERK_PASSKEY_RP_DOMAINS }}
          CLERK_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          signed=false
          notarized=false
          if [[ -n "$CSC_LINK" ]]; then
            signed=true
            if [[ -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then notarized=true; fi
          fi
          windows_signing=unsigned
          if [[ -n "$AZURE_TENANT_ID" && -n "$AZURE_CLIENT_ID" && -n "$AZURE_CLIENT_SECRET" && -n "$AZURE_PROFILE" && -n "$AZURE_PUBLISHER" ]]; then windows_signing=azure
          elif [[ -n "$WIN_CSC_LINK" ]]; then windows_signing=pfx
          fi
          printf 'signed=%s\nnotarized=%s\nwindows_signing=%s\n' "$signed" "$notarized" "$windows_signing" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Prepare real-stack test dependencies
        run: |
          vp run --filter @workjet/desktop ensure:electron
          cargo build --locked --jobs 2 --manifest-path native/resource-monitor/Cargo.toml
      - name: Validate release contracts (main CI owns broad source checks)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node scripts/assert-github-actions-pinned.mjs > "$RUNNER_TEMP/release-contracts.log" 2>&1
          if ! node --test scripts/generate-workjet-install-manifest.test.mjs >> "$RUNNER_TEMP/release-contracts.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/release-contracts.log"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/release-contracts.log"

  ssh_servers:
    needs: preflight
    uses: ./.github/workflows/ssh-server-artifacts.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}

  build:
    name: Desktop (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [preflight, ssh_servers]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: mac, arch: arm64, target: dmg }
          - { runner: ubuntu-24.04, platform: linux, arch: x64, target: AppImage }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, target: AppImage }
          - { runner: windows-latest, platform: win, arch: x64, target: nsis }
          - { runner: windows-11-arm, platform: win, arch: arm64, target: nsis }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: workjet-ssh-server-*
          path: apps/desktop/resources/ssh-servers
          merge-multiple: true
      - name: Align release versions
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Prepare Azure Artifact Signing
        if: matrix.platform == 'win' && needs.preflight.outputs.windows_signing == 'azure'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Install-Module TrustedSigning -MinimumVersion 0.5.0 -Force -AllowClobber -Scope CurrentUser -Repository PSGallery
      - name: Reuse matching Linux node-pty for the WSL backend
        if: matrix.platform == 'win'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          directory="$GITHUB_WORKSPACE/apps/desktop/resources/ssh-servers"
          mkdir -p "$GITHUB_WORKSPACE/wsl-prebuild"
          # Git Bash tar can interpret a Windows drive colon as a remote archive.
          # Stay in the artifact directory and pass a relative archive filename.
          cd "$directory"
          archive="workjet-server-linux-$ARCH.tgz"
          sha256sum --check "$archive.sha256"
          member="$(node "$GITHUB_WORKSPACE/scripts/lib/wsl-pty-archive.mjs" "$archive" "$ARCH")"
          printf 'Selected verified WSL PTY (%s): %s\n' "$ARCH" "$member"
          tar -xOzf "$archive" "$member" > "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"
          test -s "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"
      - name: Build installers (configured signing or explicit fallback)
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          MAC_SIGNED: ${{ needs.preflight.outputs.signed }}
          MAC_NOTARIZED: ${{ needs.preflight.outputs.notarized }}
          WINDOWS_SIGNING: ${{ needs.preflight.outputs.windows_signing }}
          UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://weu.codesigning.azure.net/' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || 'metricspace-signing' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          WORKJET_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WORKJET_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.WORKJET_CLERK_PASSKEY_RP_DOMAINS }}
          WORKJET_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          export ELECTRON_CACHE="$RUNNER_TEMP/electron-cache"
          export ELECTRON_BUILDER_CACHE="$RUNNER_TEMP/electron-builder-cache"
          args=(--platform "$PLATFORM" --arch "$ARCH" --target "$TARGET" --output-dir "$RUNNER_TEMP/installers"
            --gpu-build-owner "github-actions:${GITHUB_REPOSITORY_ID}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            --prebuilt-linux-ssh-server "$GITHUB_WORKSPACE/apps/desktop/resources/ssh-servers"
            --update-feed-url "https://ctox.dev/updates/workjet/$UPDATE_CHANNEL/")
          if [[ "$PLATFORM" == mac && "$MAC_SIGNED" == true ]]; then
            umask 077
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            if [[ -n "$MACOS_PROVISIONING_PROFILE" ]]; then
              export WORKJET_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/Workjet.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$WORKJET_MACOS_PROVISIONING_PROFILE"
            fi
            args+=(--signed)
            if [[ "$MAC_NOTARIZED" == true ]]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
              chmod 600 "$APPLE_API_KEY"
            else
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
          fi
          if [[ "$PLATFORM" == win ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
            if [[ "$WINDOWS_SIGNING" != unsigned ]]; then args+=(--signed); fi
            if [[ "$WINDOWS_SIGNING" == azure ]]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"
          if [[ "$PLATFORM" == linux ]]; then
            args[5]=deb
            args+=(--skip-build)
            node scripts/build-desktop-artifact.ts "${args[@]}"
          fi
      - name: Retain Windows server source after a failed installer build
        if: failure() && matrix.platform == 'win'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-server-source-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/server/dist/bin.mjs
            apps/server/dist/bin.mjs.map
            apps/server/dist/service-launcher.mjs
            apps/server/dist/service-launcher.mjs.map
            apps/server/package.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify macOS signatures
        if: matrix.platform == 'mac'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ditto -xk "$RUNNER_TEMP"/installers/Workjet-*-"$ARCH".zip "$RUNNER_TEMP/verify"
          for app in "$RUNNER_TEMP"/verify/*.app; do
            test -d "$app"
            codesign --verify --deep --strict "$app"
            ELECTRON_RUN_AS_NODE=1 "$app"/Contents/MacOS/* -e 'if (!process.versions.electron) process.exit(1)'
          done
      - name: Collect only installable assets and updater metadata
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          for file in "$RUNNER_TEMP"/installers/*; do
            case "$file" in
              *.dmg|*.zip|*.AppImage|*.deb|*.exe|*.blockmap|*.yml) cp "$file" "$RUNNER_TEMP/release-assets/" ;;
            esac
          done
          if [[ "$PLATFORM" == win && "$ARCH" == arm64 ]]; then
            for file in "$RUNNER_TEMP"/release-assets/*.yml; do
              [[ -f "$file" ]] || continue
              mv "$file" "$RUNNER_TEMP/release-assets/latest-win-arm64.yml"
            done
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create unpublished draft
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_NAME: ${{ needs.preflight.outputs.name }}
      NOTARIZED: ${{ needs.preflight.outputs.notarized }}
      WINDOWS_SIGNING: ${{ needs.preflight.outputs.windows_signing }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify release surface and prepare notes
        run: |
          set -euo pipefail
          node scripts/merge-update-manifests.ts --platform win release-assets/latest.yml release-assets/latest-win-arm64.yml release-assets/latest.yml
          rm release-assets/latest-win-arm64.yml
          node scripts/generate-workjet-install-manifest.mjs --assets-dir release-assets --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY" --output release-assets/workjet-desktop-install-manifest-v1.json --targets macos/arm64,linux/x64,linux/arm64,windows/x64,windows/arm64
          node scripts/verify-workjet-release-assets.mjs release-assets --targets macos/arm64,linux/x64,linux/arm64,windows/x64,windows/arm64
          git rev-parse HEAD > release-assets/SOURCE_COMMIT
          (cd release-assets && sha256sum Workjet-* workjet-desktop-install-manifest-v1.json SOURCE_COMMIT > SHA256SUMS)
          printf '# %s\n\nUnpublished draft; publication requires Michael and the supervisor.\n\nSource: %s\n' "$RELEASE_NAME" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          if [[ "$NOTARIZED" != true ]]; then
            printf '\n**nicht notarisiert**: macOS packages use ad-hoc signing when Apple credentials are absent. Gatekeeper may require explicit approval.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if [[ "$WINDOWS_SIGNING" == unsigned ]]; then printf '\n**Windows unsigniert**: Azure/PFX configuration is not yet complete.\n' >> "$RUNNER_TEMP/release-notes.md"; fi
          printf '\nIncluded: macOS arm64 (DMG + ZIP), Linux x64/arm64 (AppImage + DEB), Windows x64/arm64 (NSIS). All five targets are mandatory.\n\nUpdater: https://ctox.dev/updates/workjet/<channel>/ (feed activation delivered separately). Assets remain on GitHub Releases.\n\nnpm publication, Vercel deployment, Release-App main writes and Discord announcements are disabled for drafts.\n' >> "$RUNNER_TEMP/release-notes.md"
      - name: Refuse to overwrite any existing release
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          [[ -z "$existing" ]] || { echo "Release $RELEASE_TAG already exists; refusing to overwrite it."; exit 1; }
      - name: Create draft only (never publish)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.name }}
          draft: true
          prerelease: ${{ needs.preflight.outputs.notarized != 'true' || needs.preflight.outputs.windows_signing == 'unsigned' || contains(needs.preflight.outputs.version, '-') }}
          make_latest: false
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: release-assets/*
