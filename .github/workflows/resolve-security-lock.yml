name: Resolve security lockfile

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: resolve-security-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.head_ref == 'codex/security-lock-resolution'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAYON_NUM_THREADS: 2
      UV_THREADPOOL_SIZE: 2
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup existing package manager
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Resolve lockfile without installing or executing package scripts
        run: |
          vp install --lockfile-only --ignore-scripts --no-frozen-lockfile -- --network-concurrency=2
          git rev-parse HEAD > resolution-source.txt
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-lockfile
          path: |
            pnpm-lock.yaml
            resolution-source.txt
          if-no-files-found: error
          retention-days: 1
