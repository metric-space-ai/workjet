[package]
name = "workjet-provider-gateway-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR AGPL-3.0-only"
description = "Environment-scoped Workjet host for the portable provider gateway"

[lib]
path = "src/lib.rs"

[[bin]]
name = "workjet-provider-gateway-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
uuid = { version = "1", features = ["v4"] }
workjet-provider-gateway = { path = "../provider-gateway" }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

# Release-artifact packaging only. `native/resource-monitor` is the precedent;
# `panic = "abort"` is deliberately NOT adopted here because the host is a
# long-lived multi-task tokio daemon whose per-task unwinding is load-bearing
# behavior, and this profile must not change how the gateway behaves.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
