[package]
name = "ctox-web-stack"
version = "0.1.0"
edition = "2021"
license = "MIT AND ISC AND (MIT OR AGPL-3.0-only)"
exclude = ["fixtures/sources/**"]

[features]
default = ["full"]
full = ["dep:ctox-pdf-parse"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ctox-pdf-parse = { path = "../pdf-parse", optional = true }
libc = "0.2"
rand = "0.8"
regex = "1"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
[[bin]]
name = "workjet-web-stack"
path = "src/bin/workjet-web-stack.rs"
required-features = ["full"]

[[test]]
name = "capability_contract"
required-features = ["full"]
